<div class="main-search">

    <div class="flex-container profile-container">
        <h1>UREDI PROFIL</h1>
        <img class="profile-img" src="/images/woman-post.svg" alt="">

        <form class="word-edit-top" hx-post="/user/" hx-target=".main">
            <div class="word-edit-container">
                <label for="home" class="word-edit-label ">IME</label>
                <input class="word-edit" type="text" id="home" name="name" value="{{ user.Name }}" required>
            </div>
            <div class="word-edit-container">
                <label for="home" class="word-edit-label ">PREZIME</label>
                <input class="word-edit" type="text" id="home" name="surname" value="{{ user.Surname }}" required>
            </div>
            <div class="save-changes-container">
                <button class="save-changes" type="submit">SPREMI PROMJENE</button>
                <img src="/images/blue-warning.png" alt="">
            </div>

        </form>
        <p><a id="pass-reset" href="/reset">Ne znaš lozinku?</a></p>

    </div>

</div>
