{% for language in languages %}
<div class="word-add">
    <div class="actual-word">{{ language.Name }}</div>
    <div class="word-buttons">
        <div hx-target=".main" hx-get="/locale/editLocale/{{ language.ID }}"><img class="edit-button"
                src="/images/blue-edit.png" alt=""></div>
        <div hx-push-url="false" hx-target=".main-holder" hx-get="/locale/deleteLocale/{{ language.ID }}"><img
                class="add-button" src="/images/black-remove.png" alt=""></div>
    </div>
</div>
{% endfor %}
