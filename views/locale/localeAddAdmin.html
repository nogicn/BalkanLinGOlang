<div class="main-search">
    <div class="flex-container profile-container">
        <h2 class="language-title">UREĐIVANJE LOKALA</h2>
        <br>

        <!--defenirati u BP sve sto nam treba za rjecnik pa fixati u value poljima-->

        <form class="word-edit-top" action="/locale/saveLocale" method="POST">
            <input type="hidden" name="id" value="{% if locale %}{{ locale.ID }}{% endif %}">
            <div class="word-edit-container">
                <label for="name" class="word-edit-label ">IME</label>
                <input class="word-edit" type="text" id="name" name="name" placeholder='"ENGLESKI"' {% if locale %}
                    value="{{ locale.Name }}" {% endif %}>
            </div>
            <div class="word-edit-container">
                <label for="shortName" class="word-edit-label ">KRATICA</label>
                <input class="word-edit" type="text" id="shortName" name="shorthand" placeholder='"EN"' {% if locale %}
                    value="{{ locale.Shorthand }}" {% endif %}>
            </div>

            <div class="word-edit-container">
                <label for="flagIcon" class="word-edit-label ">IKONA</label>
                <input class="word-edit" type="text" id="flagIcon" name="flagIcon" placeholder='"🇬🇧"' {% if locale %}
                    value="{{ locale.FlagIcon }}" {% endif %}>
            </div>

            <div class="save-changes-container">
                <button class="save-changes" type="submit">SPREMI PROMJENE</button>
                <img src="/images/blue-warning.png" alt="">
            </div>
        </form>
    </div>
</div>
